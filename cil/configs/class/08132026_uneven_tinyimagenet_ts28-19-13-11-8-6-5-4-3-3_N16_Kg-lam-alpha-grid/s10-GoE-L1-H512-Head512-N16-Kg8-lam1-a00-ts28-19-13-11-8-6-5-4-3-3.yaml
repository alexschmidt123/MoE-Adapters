# 08132026_uneven_tinyimagenet_ts28-19-13-11-8-6-5-4-3-3_N16_Kg-lam-alpha-grid: GoE L1-H512-Head512 N=16, K_g=8, λ=1.0, α=0.0. 10 tasks, uneven task_sizes [28, 19, 13, 11, 8, 6, 5, 4, 3, 3] (sum 100); class_order tinyimagenet100.yaml. Run: --config-name 08132026_uneven_tinyimagenet_ts28-19-13-11-8-6-5-4-3-3_N16_Kg-lam-alpha-grid/s10-GoE-L1-H512-Head512-N16-Kg8-lam1-a00-ts28-19-13-11-8-6-5-4-3-3

hydra:
  run:
    dir: ./experiments/${scenario}/${config_name_no_ext:}-${now:%m%d%Y-%H%M%S}
  job:
    chdir: true
  job_logging:
    version: 1
    formatters:
      simple:
        format: '%(message)s'

class_order: "class_orders/tinyimagenet100.yaml"
dataset_root: "../datasets"
workdir: ""
log_path: "metrics.json"
model_name: "ViT-B/16"
prompt_template: "a bad photo of a {}."

batch_size: 32
scenario: "class"
dataset: "tinyimagenet"
task_sizes: [28, 19, 13, 11, 8, 6, 5, 4, 3, 3]

weight_decay: 0.0
l2: 0
ce_method: 0
method: "MoE-Adapters-N16-GoE"
lr: 1e-3
ls: 0.0
epochs: 15

model:
  num_experts: 16
  top_k: 2
  task_adaptive_top_k_base: 10
  task_adaptive_top_k_step: 5
  graph_mixer_enabled: true
  graph_symmetrize: true
  graph_add_self_loop: true
  graph_num_layers: 1
  graph_hidden_dim: 512
  graph_head_layers: [512]
  graph_alpha_init: 0.0
  graph_entropy_weight: 0.0
  graph_use_noisy_adjacency: false
  graph_noise_epsilon: 0.0
  goe_residual_alpha: 0.1
  moe_load_balance_weight: 0.01
  goe_experts_on_x: true
  goe_route_from_per_expert: true
  goe_freeze_gnn_after_task: -1
  goe_residual_lambda: 1.0
  graph_identity_bias_alpha: 0.0
  graph_adj_top_m: 9
  moe_router_z_loss_weight: 0.0001
