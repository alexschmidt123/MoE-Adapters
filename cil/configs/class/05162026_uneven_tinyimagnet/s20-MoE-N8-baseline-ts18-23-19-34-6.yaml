# 05162026_uneven_tinyimagnet: MoE N8 baseline. 5 tasks, uneven task_sizes [18, 23, 19, 34, 6] (sum 100); class_order tinyimagenet100.yaml. Run: --config-name 05162026_uneven_tinyimagnet/s20-MoE-N8-baseline-ts18-23-19-34-6

hydra:
  run:
    dir: ./experiments/${scenario}/${config_name_no_ext:}-${now:%m%d%Y-%H%M%S}
  job:
    chdir: true
  job_logging:
    version: 1
    formatters:
      simple:
        format: '%(message)s'

class_order: "class_orders/tinyimagenet100.yaml"
dataset_root: "../datasets"
workdir: ""
log_path: "metrics.json"
model_name: "ViT-B/16"
prompt_template: "a bad photo of a {}."

batch_size: 32
scenario: "class"
dataset: "tinyimagenet"
task_sizes: [18, 23, 19, 34, 6]

weight_decay: 0.0
l2: 0
ce_method: 0
method: "MoE-Adapters-N8"
lr: 1e-3
ls: 0.0
epochs: 15

model:
  num_experts: 8
  top_k: 2
  graph_mixer_enabled: false
  moe_load_balance_weight: 0.01
