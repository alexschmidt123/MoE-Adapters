# 03262026_uneven_tinyimagenet_ts28-19-13-11-8-6-5-4-3-3: MoE N8 baseline. 10 tasks, uneven task_sizes ×2 vs s10 (sum 200); class_order tinyimagenet.yaml (200 IDs). Run: --config-name 03262026_uneven_tinyimagenet_ts28-19-13-11-8-6-5-4-3-3/s20-MoE-N8-baseline

hydra:
  run:
    dir: ./experiments/${scenario}/${config_name_no_ext:}-${now:%m%d%Y-%H%M%S}
  job:
    chdir: true
  job_logging:
    version: 1
    formatters:
      simple:
        format: '%(message)s'

class_order: "class_orders/tinyimagenet.yaml"
dataset_root: "../datasets"
workdir: ""
log_path: "metrics.json"
model_name: "ViT-B/16"
prompt_template: "a bad photo of a {}."

batch_size: 32
scenario: "class"
dataset: "tinyimagenet"
task_sizes: [56, 38, 26, 22, 16, 12, 10, 8, 6, 6]

weight_decay: 0.0
l2: 0
ce_method: 0
method: "MoE-Adapters-N8"
lr: 1e-3
ls: 0.0
epochs: 15

model:
  num_experts: 8
  top_k: 2
  graph_mixer_enabled: false
  moe_load_balance_weight: 0.01

