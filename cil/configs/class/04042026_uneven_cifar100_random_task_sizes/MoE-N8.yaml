# 04042026: MoE N8, CIFAR-100; same multiset as uneven split, random permutation (seed 42): [13,5,4,19,8,11,28,6,3,3]; class_order cifar100.yaml. Run: --config-name 04042026_uneven_cifar100_random_task_sizes/MoE-N8

hydra:
  run:
    dir: ./experiments/${scenario}/${config_name_no_ext:}-${now:%m%d%Y-%H%M%S}
  job:
    chdir: true
  job_logging:
    version: 1
    formatters:
      simple:
        format: '%(message)s'

class_order: "class_orders/cifar100.yaml"
dataset_root: "../datasets"
workdir: ""
log_path: "metrics.json"
model_name: "ViT-B/16"
prompt_template: "a bad photo of a {}."

batch_size: 32
scenario: "class"
dataset: "cifar100"
task_sizes: [13, 5, 4, 19, 8, 11, 28, 6, 3, 3]

weight_decay: 0.0
l2: 0
ce_method: 0
method: "MoE-Adapters-N8"
lr: 1e-3
ls: 0.0
epochs: 15

model:
  num_experts: 8
  top_k: 2
  graph_mixer_enabled: false
  moe_load_balance_weight: 0.01
