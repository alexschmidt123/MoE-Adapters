# Configuration for TinyImageNet: 100-20 scenario (5 step, 100 base classes), N=32, Original, NoGNN
# Generated unified config for comprehensive experiments

defaults:
  - ../reference/tinyimagenet_100-20
  - _self_

# Override method name to create distinct output directory
method: "MoE-Adapters-N32"

# Dataset configuration
dataset_root: ""
class_order: ""
workdir: ""
scenario: "class"
prompt_template: "a bad photo of a {}."
log_path: "metrics.json"
model_name: "ViT-B/16"
dataset: "tinyimagenet"
batch_size: 64
increment: 20
initial_increment: 100  # 100 base classes from 200 total
weight_decay: 0.0
l2: 0
ce_method: 0
lr: 1e-3
ls: 0.0

# Model configuration
model:
  # MoE parameters
  num_experts: 32           # Number of experts (N=32)
  top_k: 2                 # Keep k=2 (standard sparse MoE)
  
  # Standard MoE (no HMoE)
  hmoe_enabled: false
  
  # Graph mixer DISABLED
  graph_mixer_enabled: false
