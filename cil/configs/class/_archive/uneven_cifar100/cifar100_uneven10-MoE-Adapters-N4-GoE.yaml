# CIFAR-100 uneven 10 tasks — MoE-GNN (GoE), N=4.
# task_sizes: [5, 15, 8, 12, 10, 8, 15, 10, 10, 7] (sum=100).
# Run: bash run.sh configs/class/uneven_cifar100/cifar100_uneven10-MoE-Adapters-N4-GoE.yaml
# Use smaller batch_size to avoid OOM (GoE adds GNN on top of MoE).

defaults:
  - cifar100_base
  - _self_

task_sizes: [5, 15, 8, 12, 10, 8, 15, 10, 10, 7]

batch_size: 32  # Windows PC (47GB GPU); use 24 or 16 if OOM
epochs: 15     # Need enough epochs for new tasks to learn

method: "MoE-Adapters-N4-GoE"

model:
  num_experts: 4
  top_k: 2
  task_adaptive_top_k_base: 10
  task_adaptive_top_k_step: 5
  graph_mixer_enabled: true
  graph_symmetrize: true
  graph_add_self_loop: true
  graph_alpha_init: 0.0
  graph_entropy_weight: 0.0
  graph_use_noisy_adjacency: false
  graph_noise_epsilon: 0.0
  # Load balance: encourages uniform expert usage (reduces collapse, improves stability)
  moe_load_balance_weight: 0.01
