# Base CIFAR-100 config — flexible task size.
# Use this as default for any CIFAR-100 run. Child configs set either:
#   - initial_increment + increment  (even split, e.g. 2-2 or 10-10), or
#   - task_sizes: [n1, n2, ...]      (uneven split, sum=100)
# All results go to experiments/ only (no "output" or "outputs" folder).
hydra:
  run:
    # Timestamp format: mmddyyyy-HHMMSS
    dir: ./experiments/${scenario}/${config_name_no_ext:}-${now:%m%d%Y-%H%M%S}
  job:
    chdir: true
  job_logging:
    version: 1
    formatters:
      simple:
        format: '%(message)s'

class_order: "class_orders/cifar100.yaml"
dataset_root: "../datasets"
workdir: ""
log_path: "metrics.json"
model_name: "ViT-B/16"
prompt_template: "a bad photo of a {}."

batch_size: 64
scenario: "class"
dataset: "cifar100"

# Default even split (overridden by child: e.g. 2-2 or 10-10, or use task_sizes for uneven)
increment: ${initial_increment}
initial_increment: 10

weight_decay: 0.0
l2: 0
ce_method: 0
method: "MoE-Adapters"
lr: 1e-3
ls: 0.0
epochs: 1
