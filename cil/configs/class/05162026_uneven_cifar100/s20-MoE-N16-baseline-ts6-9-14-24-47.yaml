# 05162026_uneven_cifar100: MoE N16 baseline. 5 tasks, uneven task_sizes [6, 9, 14, 24, 47] (sum 100); class_order cifar100.yaml. Run: --config-name 05162026_uneven_cifar100/s20-MoE-N16-baseline-ts6-9-14-24-47

hydra:
  run:
    dir: ./experiments/${scenario}/${config_name_no_ext:}-${now:%m%d%Y-%H%M%S}
  job:
    chdir: true
  job_logging:
    version: 1
    formatters:
      simple:
        format: '%(message)s'

class_order: "class_orders/cifar100.yaml"
dataset_root: "../datasets"
workdir: ""
log_path: "metrics.json"
model_name: "ViT-B/16"
prompt_template: "a bad photo of a {}."

batch_size: 32
scenario: "class"
dataset: "cifar100"
task_sizes: [6, 9, 14, 24, 47]

weight_decay: 0.0
l2: 0
ce_method: 0
method: "MoE-Adapters-N16"
lr: 1e-3
ls: 0.0
epochs: 15

model:
  num_experts: 16
  top_k: 2
  graph_mixer_enabled: false
  moe_load_balance_weight: 0.01
