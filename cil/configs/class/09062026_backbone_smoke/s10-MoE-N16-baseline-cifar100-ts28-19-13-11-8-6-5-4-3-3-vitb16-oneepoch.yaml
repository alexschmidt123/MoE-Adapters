# Backbone smoke: cifar100 MoE baseline N=16, ViT-B/16, task_sizes [28,19,13,11,8,6,5,4,3,3], 1 epoch.
# Run: python run.py configs/class/09062026_backbone_smoke/s10-MoE-N16-baseline-cifar100-ts28-19-13-11-8-6-5-4-3-3-vitb16-oneepoch.yaml
hydra:
  run:
    dir: ./experiments/${scenario}/${config_name_no_ext:}-${now:%m%d%Y-%H%M%S}
  job:
    chdir: true
  job_logging:
    version: 1
    formatters:
      simple:
        format: '%(message)s'

class_order: "class_orders/cifar100.yaml"
dataset_root: "../datasets"
workdir: ""
log_path: "metrics.json"
model_name: "ViT-B/16"
prompt_template: "a bad photo of a {}."

batch_size: 32
scenario: "class"
dataset: "cifar100"
task_sizes: [28, 19, 13, 11, 8, 6, 5, 4, 3, 3]

weight_decay: 0.0
l2: 0
ce_method: 0
method: "MoE-Adapters-N16"
lr: 1e-3
ls: 0.0
epochs: 1

model:
  num_experts: 16
  top_k: 2
  graph_mixer_enabled: false
  moe_load_balance_weight: 0.01
