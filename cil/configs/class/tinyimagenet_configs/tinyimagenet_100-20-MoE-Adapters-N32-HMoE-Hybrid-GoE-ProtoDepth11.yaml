# Configuration for TinyImageNet: 100-20 scenario (5 step, 100 base classes), N=32, HMoE-Hybrid, GoE-ProtoDepth11 (No Noise)

defaults:
  - ../reference/tinyimagenet_100-20
  - _self_

method: "MoE-Adapters-N32-HMoE-Hybrid-GoE-ProtoDepth11"

dataset_root: ""
class_order: ""
workdir: ""
scenario: "class"
prompt_template: "a bad photo of a {}."
log_path: "metrics.json"
model_name: "ViT-B/16"
dataset: "tinyimagenet"
batch_size: 64
increment: 20
initial_increment: 100  # 100 base classes from 200 total
weight_decay: 0.0
l2: 0
ce_method: 0
lr: 1e-3
ls: 0.0

model:
  num_experts: 32
  top_k: 2
  hmoe_enabled: true
  hmoe_strategy: "hybrid"
  hmoe_base_capacity: 32
  hmoe_balanced_activation_weight: 0.01
  hmoe_gate_entropy_weight: 0.0
  hmoe_load_balance_weight: 0.0
  graph_mixer_enabled: true
  graph_symmetrize: true
  graph_add_self_loop: true
  graph_alpha_init: 0.0
  graph_entropy_weight: 0.0
  graph_use_noisy_adjacency: false
  graph_noise_epsilon: 0.0
  graph_proto_layers: [512, 256, 128, 64, 32, 16, 8, 4, 2, 1]
  graph_proto_activation: "gelu"
  graph_proto_use_norm: true
  graph_proto_dropout: 0.1
