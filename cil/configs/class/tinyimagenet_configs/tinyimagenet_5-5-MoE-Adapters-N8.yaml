# Configuration for TinyImageNet: 5-5 scenario, N=8, Original, NoGNN
# Generated unified config for comprehensive experiments

defaults:
  - ../reference/tinyimagenet_5-5-MoE-Adapters
  - _self_

# Override method name to create distinct output directory
method: "MoE-Adapters-N8"

# Dataset configuration
dataset_root: ""
class_order: ""
workdir: ""
scenario: "class"
prompt_template: "a bad photo of a {}."
log_path: "metrics.json"
model_name: "ViT-B/16"
dataset: "tinyimagenet"
batch_size: 64
increment: ${initial_increment}
initial_increment: 5
weight_decay: 0.0
l2: 0
ce_method: 0
lr: 1e-3
ls: 0.0

# Model configuration
model:
  # MoE parameters
  num_experts: 8           # Number of experts (N=8)
  top_k: 2                 # Keep k=2 (standard sparse MoE)
  
  # Standard MoE (no HMoE)
  hmoe_enabled: false
  
  # Graph mixer DISABLED
  graph_mixer_enabled: false
