# Configuration for TinyImageNet: 100 base classes, 5 classes per incremental task (20 step)
# This corresponds to "20 step" in the paper table
# Paper: "100 base classes" with 20 incremental tasks (5 classes each)

defaults:
  - ../reference/tinyimagenet_100-5
  - _self_

# Override method name to create distinct output directory
method: "MoE-Adapters-N2"

# Dataset configuration
dataset_root: ""
class_order: ""
workdir: ""
scenario: "class"
prompt_template: "a bad photo of a {}."
log_path: "metrics.json"
model_name: "ViT-B/16"
dataset: "tinyimagenet"
batch_size: 64
increment: 5
initial_increment: 100  # 100 base classes from 200 total
weight_decay: 0.0
l2: 0
ce_method: 0
lr: 1e-3
ls: 0.0
epochs: 1

# Model configuration
model:
  # MoE parameters
  num_experts: 2           # Number of experts (N=2, baseline from paper)
  top_k: 2                 # Keep k=2 (standard sparse MoE)
  
  # Standard MoE (no HMoE)
  hmoe_enabled: false
  
  # Graph mixer DISABLED
  graph_mixer_enabled: false
