# Key config 2/2: MoE-GNN (GoE) with default settings. Self-contained. Other 26 GoE configs extend this and override only model.graph_*.
# Defaults: graph_num_layers=2, graph_hidden_dim=768, graph_head_layers=null. Run: --config-name 02052026_uneven_cifar100/GoE-L2-H768-HeadNone

hydra:
  run:
    dir: ./experiments/${scenario}/${config_name_no_ext:}-${now:%m%d%Y-%H%M%S}
  job:
    chdir: true
  job_logging:
    version: 1
    formatters:
      simple:
        format: '%(message)s'

class_order: "class_orders/cifar100.yaml"
dataset_root: "../datasets"
workdir: ""
log_path: "metrics.json"
model_name: "ViT-B/16"
prompt_template: "a bad photo of a {}."

batch_size: 32
scenario: "class"
dataset: "cifar100"
task_sizes: [46, 2, 2, 20, 20, 2, 2, 2, 2, 2]  # min 2 classes per task; sum=100
increment: 10
initial_increment: 10

weight_decay: 0.0
l2: 0
ce_method: 0
method: "MoE-Adapters-N8-GoE"
lr: 1e-3
ls: 0.0
epochs: 15

model:
  num_experts: 8
  top_k: 2
  task_adaptive_top_k_base: 10
  task_adaptive_top_k_step: 5
  graph_mixer_enabled: true
  graph_symmetrize: true
  graph_add_self_loop: true
  graph_num_layers: 2
  graph_hidden_dim: 768
  graph_head_layers: null
  graph_alpha_init: 0.0
  graph_entropy_weight: 0.0
  graph_use_noisy_adjacency: false
  graph_noise_epsilon: 0.0
  goe_residual_alpha: 0.1
  moe_load_balance_weight: 0.01
