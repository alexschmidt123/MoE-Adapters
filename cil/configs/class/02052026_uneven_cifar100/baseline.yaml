# Key config 1/2: Baseline MoE N8 only (no GNN). Heavy uneven task_sizes. Self-contained.
# Other configs do not extend this; baseline is standalone. Run: --config-path configs/class --config-name 02052026_uneven_cifar100/baseline

hydra:
  run:
    dir: ./experiments/${scenario}/${config_name_no_ext:}-${now:%m%d%Y-%H%M%S}
  job:
    chdir: true
  job_logging:
    version: 1
    formatters:
      simple:
        format: '%(message)s'

class_order: "class_orders/cifar100.yaml"
dataset_root: "../datasets"
workdir: ""
log_path: "metrics.json"
model_name: "ViT-B/16"
prompt_template: "a bad photo of a {}."

batch_size: 32
scenario: "class"
dataset: "cifar100"
task_sizes: [50, 2, 1, 20, 20, 1, 2, 2, 1, 1]
increment: 10
initial_increment: 10

weight_decay: 0.0
l2: 0
ce_method: 0
method: "MoE-Adapters-N8"
lr: 1e-3
ls: 0.0
epochs: 15

model:
  num_experts: 8
  top_k: 2
  graph_mixer_enabled: false
