# 04062026_uneven_tinyimagenet_ts46-2-2-20-20-2-2-2-2-2: GoE L1-H512-Head512 N=8, λ=0.3, α=0.5. 10 tasks, uneven task_sizes ×2 vs s10 (sum 200); base [46,2,2,20,20,2,2,2,2,2]; class_order tinyimagenet.yaml (200 IDs). Run: --config-name 04062026_uneven_tinyimagenet_ts46-2-2-20-20-2-2-2-2-2/s20-GoE-L1-H512-Head512-N8-lam03-a05

hydra:
  run:
    dir: ./experiments/${scenario}/${config_name_no_ext:}-${now:%m%d%Y-%H%M%S}
  job:
    chdir: true
  job_logging:
    version: 1
    formatters:
      simple:
        format: '%(message)s'

class_order: "class_orders/tinyimagenet.yaml"
dataset_root: "../datasets"
workdir: ""
log_path: "metrics.json"
model_name: "ViT-B/16"
prompt_template: "a bad photo of a {}."

batch_size: 32
scenario: "class"
dataset: "tinyimagenet"
task_sizes: [92, 4, 4, 40, 40, 4, 4, 4, 4, 4]

weight_decay: 0.0
l2: 0
ce_method: 0
method: "MoE-Adapters-N8-GoE"
lr: 1e-3
ls: 0.0
epochs: 15

model:
  num_experts: 8
  top_k: 2
  task_adaptive_top_k_base: 10
  task_adaptive_top_k_step: 5
  graph_mixer_enabled: true
  graph_symmetrize: true
  graph_add_self_loop: true
  graph_num_layers: 1
  graph_hidden_dim: 512
  graph_head_layers: [512]
  graph_alpha_init: 0.0
  graph_entropy_weight: 0.0
  graph_use_noisy_adjacency: false
  graph_noise_epsilon: 0.0
  goe_residual_alpha: 0.1
  moe_load_balance_weight: 0.01
  goe_experts_on_x: true
  goe_route_from_per_expert: true
  goe_freeze_gnn_after_task: -1
  goe_residual_lambda: 0.3
  graph_identity_bias_alpha: 0.5
  graph_adj_top_m: 8
  moe_router_z_loss_weight: 0.0001

